name: eks infrastructure and application deployment

on:
  push:
    branches:
      - main

permissions:
    contents: read 
    id-token: write

env:
    AWS_REGION: eu-north-1
    CLUSTER_NAME: to-do-app-cluster
    BUCKET_NAME: xheyi-eks-terraform-state

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::402349694278:role/github_action_role
                aws-region: ${{env.AWS_REGION}}

            - name: setup terraform
              uses: hashicorp/setup-terraform@v4

            - name: Check and Create S3 Bucket 
              run: | 
                if aws s3api head-bucket --bucket "${{ env.BUCKET_NAME }}" 2>/dev/null; then 
                   echo "Bucket '${{ env.BUCKET_NAME }}' already exists." 
                   else 
                     echo "Bucket '${{ env.BUCKET_NAME }}' does not exist. Creating it now..." 
                     
                     if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then 
                       aws s3api create-bucket \
                         --bucket "${{ env.BUCKET_NAME }}" \
                         --region ${{ env.AWS_REGION }} 
                     else 
                       aws s3api create-bucket \
                       --bucket "${{ env.BUCKET_NAME }}" \
                       --region ${{ env.AWS_REGION }} \
                       --create-bucket-configuration \
                       LocationConstraint=${{ env.AWS_REGION }} 
                     fi 
                fi

            - name: Enable S3 Bucket Versioning
              run: |
                aws s3api put-bucket-versioning \
                --bucket "${{ env.BUCKET_NAME }}" \
                --versioning-configuration Status=Enabled

            - name: Enable S3 Bucket Encryption
              run: |
                aws s3api put-bucket-encryption \
                  --bucket "${{ env.BUCKET_NAME }}" \
                  --server-side-encryption-configuration \
                  '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

            - name: Block Public Access
              run: |
                aws s3api put-public-access-block \
                  --bucket "${{ env.BUCKET_NAME }}" \
                  --public-access-block-configuration \
                  BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

            - name: initialise terraform
              working-directory: infrastructure
              run: terraform init

            - name: Terraform fmt
              working-directory: infrastructure
              run: terraform fmt

            - name: Terraform Validate
              working-directory: infrastructure
              run: terraform validate

            - name: Terraform Plan
              working-directory: infrastructure
              run: terraform plan -out=tfplan


            - name: Terraform Apply
              id: terraform_apply
              working-directory: infrastructure
              run: terraform apply -auto-approve tfplan

            - name: Get Terraform outputs
              id: terraform
              working-directory: infrastructure
              run: |
                echo "alb_controller_role_arn=$(terraform output -raw alb_controller_role_arn)" >> "$GITHUB_OUTPUT"

            - name: Wait for Fargate profiles to be active 
              run: |
                aws eks wait fargate-profile-active \
                  --cluster-name "$CLUSTER_NAME" \
                  --fargate-profile-name "kube-system-fargate-profile" \
                  --region "$AWS_REGION"
                aws eks wait fargate-profile-active \
                  --cluster-name "$CLUSTER_NAME" \
                  --fargate-profile-name "app-fargate-profile" \
                  --region "$AWS_REGION"

            - name: Install kubectl
              uses: azure/setup-kubectl@v4
              with:
                version: 'latest'

            - name: Configure kubectl
              run: |
                aws eks update-kubeconfig \
                --name "$CLUSTER_NAME" \
                --region "$AWS_REGION"

            - name: Verify cluster access
              run: kubectl get pods -A

            - name: Install Helm
              uses: azure/setup-helm@v4

            - name: Install AWS Load Balancer Controller
              env:
                ALB_CONTROLLER_ROLE_ARN: ${{ steps.terraform.outputs.alb_controller_role_arn }}
              run: |
                helm repo add eks https://aws.github.io/eks-charts
                helm repo update

                helm upgrade --install aws-load-balancer-controller \
                  eks/aws-load-balancer-controller \
                  --namespace kube-system \
                  --create-namespace \
                  --set clusterName="$CLUSTER_NAME" \
                  --set serviceAccount.create=true \
                  --set serviceAccount.name=aws-load-balancer-controller \
                  --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$ALB_CONTROLLER_ROLE_ARN" \
                  --set region=eu-north-1 \
                  --set vpcId=vpc-05e73574e677375af \
                  --wait \
                  --timeout 10m

            - name: Wait for ALB controller to be ready
              run: |
                kubectl rollout status deployment/aws-load-balancer-controller \
                  -n kube-system \
                  --timeout=5m

            - name: Wait for webhook to be ready
              run: |
                echo "Waiting for AWS Load Balancer webhook to respond..."
                max_attempts=60
                attempt=0
                while [ $attempt -lt $max_attempts ]; do
                  if kubectl get validatingwebhookconfigurations aws-load-balancer-webhook &>/dev/null; then
                    echo "Webhook configuration found, waiting for webhook to be functional..."
                    # Check if the webhook service endpoint is responding
                    if kubectl exec -n kube-system deployment/aws-load-balancer-controller -- sh -c "curl -sk https://aws-load-balancer-webhook-service.kube-system.svc:443/health" &>/dev/null; then
                      echo "Webhook is responding"
                      sleep 10
                      break
                    fi
                  fi
                  echo "Waiting for webhook ($((attempt+1))/$max_attempts)..."
                  sleep 3
                  ((attempt++))
                done
                
                if [ $attempt -eq $max_attempts ]; then
                  echo "Warning: Webhook not responding, proceeding anyway..."
                fi

            - name: Apply Kubernetes manifests
              run: |
                max_attempts=5
                attempt=0
                while [ $attempt -lt $max_attempts ]; do
                  echo "Applying manifests (attempt $((attempt+1))/$max_attempts)..."
                  if kubectl apply -f k8s/; then
                    echo "Successfully applied manifests"
                    exit 0
                  fi
                  
                  if [ $attempt -lt $((max_attempts-1)) ]; then
                    echo "Apply failed, retrying in 20 seconds..."
                    sleep 20
                  fi
                  ((attempt++))
                done
                
                echo "Failed to apply manifests after $max_attempts attempts"
                exit 1

            - name: Verify application deployment
              run: |
                kubectl get deployments -A
                kubectl get services -A
                kubectl get ingress -A
                kubectl get pods -A


            