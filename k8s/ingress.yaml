# Optional single entrypoint (cluster Ingress controller required).
# Traffic: Internet/client → Ingress → Service/frontend → nginx → /api → Service/backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reactapp
  #namespace: reactapp
  labels:
    app: reactapp
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName:
  rules:
    - host: reactapp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
